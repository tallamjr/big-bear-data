[project]
name = "big-bear-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-storage-blob",
    "duckdb>=1.3.2",
    "graphviz",
    "h3",
    "linetimer",
    "matplotlib>=3.10.6",
    "memory-profiler>=0.61.0",
    "pandas>=2.3.2",
    "pandera>=0.26.1",
    "plotly>=6.3.0",
    "polars",
    "polars-h3",
    "psutil>=7.0.0",
    "pyarrow",
    "seaborn>=0.13.2",
    "tpchgen-cli>=2.0.0",
